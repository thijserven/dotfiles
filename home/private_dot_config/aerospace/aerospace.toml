# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Specify AeroSpace config version
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
# Homebrew owns SketchyBar's lifecycle; AeroSpace only sends state events.
after-startup-command = ['exec-and-forget sketchybar --trigger aerospace_workspace_change']

# Keep SketchyBar's active workspace in sync with AeroSpace.
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE="$AEROSPACE_FOCUSED_WORKSPACE"'
]

# Refresh SketchyBar on every binding-mode change, including CLI changes.
on-mode-changed = ['exec-and-forget sketchybar --trigger aerospace_mode_change']

# Keep pointer in place when switching workspaces, including SketchyBar clicks.
on-focus-changed = []

# Start AeroSpace at login
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true

enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows (v2 requirement)
persistent-workspaces = ['1', '2', '3', '4', '5']

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
[gaps]
    inner.horizontal = 15
    inner.vertical =   15
    outer.left =       10
    outer.bottom =     10
    outer.top =        42 # 32px SketchyBar + 10px gap
    outer.right =      10

# 'main' binding mode declaration
[mode.main.binding]

    # Layout bindings
    ctrl-slash = 'layout tiles horizontal vertical'
    ctrl-comma = 'layout accordion horizontal vertical'
    ctrl-cmd-f = 'layout floating tiling' # Toggle between floating and tiling layout

    # Focus bindings
    ctrl-h = 'focus left'
    ctrl-j = 'focus down'
    ctrl-k = 'focus up'
    ctrl-l = 'focus right'

    # Move bindings
    ctrl-cmd-h = 'move left'
    ctrl-cmd-j = 'move down'
    ctrl-cmd-k = 'move up'
    ctrl-cmd-l = 'move right'

    # Resize bindings
    ctrl-minus = 'resize width -50'
    ctrl-equal = 'resize width +50'
    ctrl-shift-minus = 'resize height -50'
    ctrl-shift-equal = 'resize height +50'

    # Workspace switching
    cmd-ctrl-n = 'workspace 1'
    cmd-ctrl-m = 'workspace 2'
    cmd-ctrl-comma = 'workspace 3'
    cmd-ctrl-period = 'workspace 4'
    cmd-ctrl-slash = 'workspace 5'

    # Move node to workspace
    cmd-ctrl-u = 'move-node-to-workspace 1'
    cmd-ctrl-i = 'move-node-to-workspace 2'
    cmd-ctrl-o = 'move-node-to-workspace 3'
    cmd-ctrl-p = 'move-node-to-workspace 4'
    cmd-ctrl-leftSquareBracket = 'move-node-to-workspace 5'

    # Workspace back and forth & Monitor management
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Switch mode
    cmd-semicolon = 'mode service'

# 'service' binding mode declaration.
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    backspace = ['close-all-windows-but-current', 'mode main']

    ctrl-h = ['join-with left', 'mode main']
    ctrl-j = ['join-with down', 'mode main']
    ctrl-k = ['join-with up', 'mode main']
    ctrl-l = ['join-with right', 'mode main']

    b = 'exec-and-forget sketchybar --trigger aerospace_service_help'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.hammerspoon.Hammerspoon'
run = 'layout floating'
