# Central user-level runtime defaults. Project mise.toml files may override these.
[tools]
bun = "1.4.2"
go = "1.27.1"
lua = "5.5.1"
node = "lts"
python = "3.14.6"
ruby = "4.0.6"
rust = "1.98.1"

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]

# Prefer portable binaries; fail rather than silently building from source.
[settings.python]
compile = false

[settings.ruby]
compile = false
